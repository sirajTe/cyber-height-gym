# Netlify: used when the site is connected via Git (drag-and-drop deploys only need the dist/ folder).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set LEAD_ENDPOINT in Netlify → Site configuration → Environment variables once the API is live.

# Versioned CSS/JS (?v=hash) can be cached for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
